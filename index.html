<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roel de Jong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="site-header.js"></script>
  <script type="module" src="home.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; background: #000; }

    /* ── Starfield canvas (drawn once, no loop) ── */
    #stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Crawl scene ── */
    .crawl-scene {
      position: fixed;
      top: 60px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      perspective: 300px;
      z-index: 1;
    }

    /* Soft fade at the top so text dissolves into space */
    .crawl-fade {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 28%;
      background: linear-gradient(to bottom, #000 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    /* Tilted plane — rotates the whole surface back from the bottom edge */
    .crawl-tilt {
      position: absolute;
      inset: 0;
      transform-origin: 50% 100%;
      transform: rotateX(25deg);
    }

    /* Scrolling text block — sits below the tilt container and animates up */
    .crawl-scroll {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: min(82%, 860px);
      color: #FFE81F;
      font-family: 'News Cycle', sans-serif;
      text-align: justify;
      padding-bottom: 40vh;
    }
    .crawl-scroll.running {
      animation: crawlUp var(--crawl-dur, 90s) linear infinite;
      will-change: transform;
    }

    @keyframes crawlUp {
      from { transform: translateX(-50%) translateY(0); }
      to   { transform: translateX(-50%) translateY(var(--crawl-end, -4000px)); }
    }

    /* ── Episode typography ── */
    .ep-intro {
      text-align: center;
      font-style: italic;
      font-size: 1.8rem;
      line-height: 2.2;
      margin-bottom: 4rem;
      opacity: 0.7;
    }
    .episode { margin-top: 4rem; }
    .ep-divider {
      border: none;
      border-top: 1px solid rgba(255,232,31,0.2);
      width: 45%;
      margin: 0 auto 2.2rem;
    }
    .ep-num {
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 0.55rem;
    }
    .ep-company {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }
    .ep-details {
      text-align: center;
      font-size: 1.05rem;
      opacity: 0.6;
      margin-bottom: 2rem;
    }
    .ep-bullet {
      font-size: 1.65rem;
      line-height: 1.85;
      margin-bottom: 1.1rem;
    }
    .ep-bullet::before { content: ''; }

    /* ── Click-to-start overlay ── */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      z-index: 200;
      user-select: none;
    }
    #start-overlay p {
      color: rgba(255,232,31,0.55);
      font-family: 'News Cycle', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin: 0;
    }
    .begin-btns {
      display: flex;
      gap: 1.2rem;
    }
    .begin-btn {
      background: transparent;
      border: 1px solid rgba(255,232,31,0.55);
      color: #FFE81F;
      font-family: 'News Cycle', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.65rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .begin-btn:hover, .begin-btn:focus-visible {
      background: rgba(255,232,31,0.1);
      border-color: #FFE81F;
      outline: none;
    }
    @keyframes btn-hit {
      0%   { transform: scale(1);    filter: none; }
      18%  { transform: scale(0.84); filter: drop-shadow(0 0 10px #00FF41) drop-shadow(0 0 22px #00FF41); }
      50%  { transform: scale(1.07); filter: drop-shadow(0 0 4px #00FF41); }
      100% { transform: scale(1);    filter: none; }
    }
    .begin-btn.hit { animation: btn-hit 0.55s ease-out forwards; }
    /* Text and buttons sit between the two canvas layers */
    #start-overlay > p,
    .begin-btns { position: relative; z-index: 10; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }
    #laser-canvas {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;   /* behind buttons */
    }
    #impact-canvas {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;  /* in front of buttons */
    }

    /* ── Mobile: scale fonts back down ── */
    @media (max-width: 600px) {
      .ep-intro   { font-size: 1rem; }
      .ep-num     { font-size: 0.8rem; }
      .ep-company { font-size: 1.5rem; }
      .ep-details { font-size: 0.8rem; }
      .ep-bullet  { font-size: 1rem; }
    }

    /* ── Reduced motion: present the crawl as static, scrollable text ── */
    @media (prefers-reduced-motion: reduce) {
      .crawl-scene { overflow-y: auto; -webkit-overflow-scrolling: touch; perspective: none; }
      .crawl-fade  { display: none; }
      .crawl-tilt  { position: static; transform: none; }
      .crawl-scroll,
      .crawl-scroll.running {
        position: static;
        transform: none;
        animation: none;
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }
      .begin-btn.hit { animation: none; }
    }
  </style>
</head>
<body>

<site-header active="home"></site-header>

<audio id="music" loop src="assets/Departure_from_Proxima.mp3"></audio>

<div id="start-overlay">
  <canvas id="laser-canvas"></canvas>
  <canvas id="impact-canvas"></canvas>
  <p>Choose your experience</p>
  <div class="begin-btns">
    <button class="begin-btn" id="btn-sound">&#9654;&nbsp; With sound</button>
    <button class="begin-btn" id="btn-muted">&#x1F507;&nbsp; Muted</button>
  </div>
</div>

<canvas id="stars"></canvas>

<main class="crawl-scene">
  <h1 class="visually-hidden">Roel de Jong — career history</h1>
  <div class="crawl-fade"></div>
  <div class="crawl-tilt">
    <div class="crawl-scroll" id="crawl-scroll">
      <div class="ep-intro">
        <p>A long time ago,</p>
        <p>in a career far, far away&hellip;</p>
      </div>
    </div>
  </div>
</main>

</body>
</html>
